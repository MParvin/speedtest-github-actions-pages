name: sitespeed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitespeed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read URLs
        id: urls
        run: |
          URLS=$(grep -v '^\s*#' urls.txt | grep -v '^\s*$' | tr '\n' ' ')
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"

      - name: Run sitespeed.io
        run: |
          docker run --rm -v "$PWD":/sitespeed.io sitespeedio/sitespeed.io \
            --outputFolder sitespeed-result \
            -n 1 \
            ${{ steps.urls.outputs.urls }}

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sitespeed-result
          publish_branch: gh-pages
